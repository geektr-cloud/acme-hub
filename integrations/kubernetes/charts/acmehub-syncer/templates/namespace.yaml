{{- $namespace := include "acmehub-syncer.namespace" . -}}
{{- $mode := toString .Values.namespace.create -}}
{{- $create := eq $mode "true" -}}
{{- if eq $mode "auto" -}}
  {{- $create = true -}}
  {{- $existing := lookup "v1" "Namespace" "" $namespace -}}
  {{- if $existing -}}
    {{- $annotations := $existing.metadata.annotations | default dict -}}
    {{- $labels := $existing.metadata.labels | default dict -}}
    {{- $releaseName := default "" (index $annotations "meta.helm.sh/release-name") -}}
    {{- $releaseNamespace := default "" (index $annotations "meta.helm.sh/release-namespace") -}}
    {{- $managedBy := default "" (index $labels "app.kubernetes.io/managed-by") -}}
    {{- $create = and (eq $releaseName .Release.Name) (eq $releaseNamespace .Release.Namespace) (eq $managedBy "Helm") -}}
  {{- end -}}
{{- end -}}
{{- if $create }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $namespace }}
  labels:
    {{- include "acmehub-syncer.labels" . | nindent 4 }}
  annotations:
    # Keep the namespace on uninstall. It may contain cluster-scoped consumer
    # token Secrets and is commonly pre-created by cluster bootstrap.
    helm.sh/resource-policy: keep
{{- end }}
