replicaCount: 1

image:
  repository: ghcr.io/geektr-cloud/acme-hub/acmehub-syncer
  tag: latest
  pullPolicy: IfNotPresent

# Namespace for the operator and ClusterACMEHubConsumer token Secrets.
# Empty means "use the release namespace" (--namespace / targetNamespace).
clusterResourceNamespace: ""

# Namespace creation policy:
#   auto  - create only if missing; skip if it already exists and is not owned
#           by this release, so pre-created namespaces never conflict.
#           Uses `lookup`, so rendering depends on live cluster state.
#   true  - always render the Namespace object (fails if it exists without
#           Helm ownership metadata).
#   false - never create it; the namespace must already exist.
namespace:
  create: auto

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}
