replicaCount: 1

image:
  repository: ghcr.io/geektr-cloud/acme-hub/acmehub-syncer
  tag: latest
  pullPolicy: IfNotPresent

# Namespace for the operator and ClusterACMEHubConsumer token Secrets.
# Empty means "use the release namespace" (--namespace / targetNamespace).
# The namespace must already exist; the chart does not create it.
clusterResourceNamespace: ""

# Proxy used only by the acme-hub API client. Supports http://, https:// and
# socks5://. When empty, the client keeps its default transport behavior
# (including any process-wide HTTPS_PROXY).
# Avoid embedding long-lived proxy credentials here: this value is stored in
# the Helm release secret and is visible via `helm get values`.
acmeHubProxy: ""

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}
