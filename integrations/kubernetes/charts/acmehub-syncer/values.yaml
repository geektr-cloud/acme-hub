replicaCount: 1

image:
  repository: ghcr.io/geektr-cloud/acme-hub/acmehub-syncer
  # Empty means v<appVersion>, so each chart version pins the matching
  # immutable image tag instead of relying on a cached "latest".
  tag: ""
  pullPolicy: IfNotPresent

# Namespace for the operator and ClusterACMEHubConsumer credential Secrets.
# Empty means "use the release namespace" (--namespace / targetNamespace).
# The namespace must already exist; the chart does not create it.
clusterResourceNamespace: ""

# Proxy used only by the acme-hub API client. Supports http://, https:// and
# socks5://. When empty, the client keeps its default transport behavior
# (including any process-wide HTTPS_PROXY).
# Avoid embedding long-lived proxy credentials here: this value is stored in
# the Helm release secret and is visible via `helm get values`.
acmeHubProxy: ""

# Optional comma-separated HTTPS origins allowed as acme-hub endpoints, for
# example "https://acme.example.com,https://staging.example.com:8443".
# Empty allows any HTTPS endpoint.
acmeHubAllowedEndpoints: ""

# Maximum number of ACMEHubCertificate reconciles to run concurrently.
maxConcurrentReconciles: 4

# Timeout for a single acme-hub certificate issue request.
issueTimeout: 180s

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}
